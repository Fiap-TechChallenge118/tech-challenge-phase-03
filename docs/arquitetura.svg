arker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="1292" y="535" font-family="Arial, sans-serif" font-size="13" fill="#334155" font-weight="400">upload manual</text><rect x="36" y="758" width="1428" height="186" rx="18" fill="white" stroke="#dbe3ed"/><text x="60" y="790" font-family="Arial, sans-serif" font-size="18" fill="#b45309" font-weight="700">04  MONITORAMENTO LOCAL · Docker Compose</text><rect x="65" y="820" width="290" height="96" rx="12" fill="#fffbeb" stroke="#dbe3ed"/><text x="83" y="850" font-family="Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="700">API local / ONNX</text><text x="83" y="876" font-family="Arial, sans-serif" font-size="16" fill="#334155" font-weight="400">Predições reais de teste</text><text x="83" y="897" font-family="Arial, sans-serif" font-size="16" fill="#334155" font-weight="400">Expõe /metrics</text><rect x="420" y="820" width="290" height="96" rx="12" fill="#fffbeb" stroke="#dbe3ed"/><text x="438" y="850" font-family="Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="700">Prometheus</text><text x="438" y="876" font-family="Arial, sans-serif" font-size="16" fill="#334155" font-weight="400">Scrape a cada 15 segundos</text><text x="438" y="897" font-family="Arial, sans-serif" font-size="16" fill="#334155" font-weight="400">Contadores e histograma</text><rect x="775" y="820" width="290" height="96" rx="12" fill="#fffbeb" stroke="#dbe3ed"/><text x="793" y="850" font-family="Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="700">Grafana</text><text x="793" y="876" font-family="Arial, sans-serif" font-size="16" fill="#334155" font-weight="400">Requisições, p95 e erros</text><text x="793" y="897" font-family="Arial, sans-serif" font-size="16" fill="#334155" font-weight="400">Distribuição por classe</text><path d="M355 868 L410 868" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" /><path d="M710 868 L765 868" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" /><text x="1100" y="849" font-family="Arial, sans-serif" font-size="17" fill="#92400e" font-weight="700">Os painéis mostram a API local.</text><text x="1100" y="877" font-family="Arial, sans-serif" font-size="16" fill="#334155" font-weight="400">Sem scrape da API AWS nesta stack.</text><text x="48" y="989" font-family="Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Linhas tracejadas: ação do operador. O CI publica a imagem; o deploy é aplicado via Terraform.</text><text x="48" y="1020" font-family="Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Extensão prevista: DAG → ECS Task → S3. A Task Definition existe; a integração de retreino ainda não está implementada.</text><text x="48" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#334155" font-weight="400">Modelo: cinco condições clínicas → mapeamento na API → normal / atenção / urgente.</text></svg>