[project]
name = "triagem-medica"
version = "0.1.0"
description = "Sistema de triagem automática de laudos médicos (classificação de urgência)."
requires-python = ">=3.11"
dependencies = [
  # API
  "fastapi==0.111.0",
  "uvicorn[standard]==0.29.0",
  # ML / model
  "scikit-learn==1.9.0",
  "joblib==1.4.2",
  "numpy==1.26.4",
  "pandas==2.2.2",
  # Dataset download (ETAPA 2)
  "kagglehub==1.0.2",
  # ONNX (inference optimization — ETAPA 9)
  "onnxruntime==1.18.0",
  "skl2onnx==1.17.0",
  # Observability (ETAPA 3 + ETAPA 8)
  "prometheus-client==0.20.0",
  # AWS (model download from S3 — ETAPA 3 / ECS)
  "boto3==1.34.106",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.0",
  "httpx==0.27.0",
  "ruff==0.4.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "src"]

[tool.ruff]
line-length = 88
exclude = ["dags/", "data/", "notebooks/", "infra/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
